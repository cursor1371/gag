# ===========================================================================
# GAG Docker Image Build & Push
#
# 触发条件：
#   - 推送 v* 标签  → 构建并推送版本镜像 + latest
#   - 推送 main 分支 → 构建并推送 edge 镜像
#   - Pull Request   → 仅构建验证，不推送
#   - 手动触发       → 构建并推送
#
# 镜像仓库：GitHub Container Registry (ghcr.io)
# 构建架构：linux/amd64, linux/arm64
# ===========================================================================

name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 从 Git 元数据生成版本号和构建时间戳
      - name: Generate build metadata
        id: build
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # QEMU：支持跨架构构建（arm64）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx：启用高级构建特性（多平台、缓存）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GHCR（PR 构建跳过，无需推送权限）
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 根据触发事件自动生成镜像标签
      #   v1.2.3 tag → 1.2.3, 1.2, latest
      #   main push  → edge
      #   所有构建   → sha-<7位哈希>
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=sha

      # 构建并推送（PR 仅构建不推送，PR 仅构建 amd64 节省时间）
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
