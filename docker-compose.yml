# ===========================================================================
# GAG Docker Compose — 一键部署
#
# 用法：
#   cp .env.example .env    # 编辑环境变量
#   docker compose up -d    # 启动
#   docker compose logs -f  # 查看日志
# ===========================================================================

services:
  gag:
    image: ghcr.io/your-org/gag:latest  # 替换为实际镜像地址，或使用 build
    # build:
    #   context: .
    #   args:
    #     VERSION: dev
    container_name: gag
    restart: unless-stopped
    ports:
      - "${PORT:-8848}:8848"
    environment:
      - ADMIN_KEY=${ADMIN_KEY:?请设置 ADMIN_KEY}
      - API_KEY=${API_KEY:-}
      - WS_TOKEN=${WS_TOKEN:-}
      - HOST=0.0.0.0
      - PORT=8848
      - CONFIG_PATH=/data/config.yaml
      - MODELS_PATH=/data/models.json
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - gag-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8848/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  gag-data:
    name: gag-data
