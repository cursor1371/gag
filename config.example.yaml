# ============================================================================
# GAG (Gemini API Gateway) 配置文件
# ============================================================================
#
# 本文件为 GAG 网关的完整运行时配置模板。
# 首次启动时，若 CONFIG_PATH 指向的文件不存在，网关将自动创建一份使用默认值的配置。
#
# 热重载：
#   - 保存文件后自动生效（fsnotify 监听，500ms 防抖）
#   - 也可通过管理 API 手动触发：POST /admin/config/reload
#   - 语法或语义错误时保持旧配置不变，错误记录到应用日志
#
# 环境变量（不在本文件中配置，不可热重载）：
#   ADMIN_KEY    - 管理 API 鉴权密钥（必填，为空则禁用管理 API）
#   API_KEY      - 快捷 API Key，自动注入为 ID=0 的默认凭证（可选）
#   WS_TOKEN     - 快捷 WS Token，自动注入为 ID=0 的默认凭证（可选）
#   HOST         - 监听地址（默认 0.0.0.0）
#   PORT         - 监听端口（默认 8848）
#   CONFIG_PATH  - 本配置文件路径（默认 ./config.yaml）
#   MODELS_PATH  - 模型列表文件路径（默认 ./models.json）
#
# API_KEY / WS_TOKEN 说明：
#   - 提供零配置快速启动能力，无需预先通过管理 API 创建凭证
#   - 注入为 ID=0 的特殊凭证，与本文件中的凭证（ID≥1）共存
#   - 不写入本文件，不受热重载影响，进程生命周期内有效
#   - 管理 API 中显示为 source: "env"，允许启用/禁用，不可删除/修改
#   - 如果本文件 keys/tokens 列表为空，仍需设置环境变量或创建凭证才能使用
#
# ============================================================================

# ----------------------------------------------------------------------------
# 上游 Gemini API 配置
# ----------------------------------------------------------------------------
upstream:
  # Google Gemini API 的基础 URL
  # 代理请求时，网关会将客户端请求路径拼接到此 URL 之后
  # 示例：客户端请求 /v1beta/models/gemini-2.5-flash:generateContent
  #       → 实际转发至 https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
  #
  # 注意：
  #   - 必须是 http 或 https 协议
  #   - 不得包含查询参数、用户凭证或片段标识符
  #   - 末尾不要加斜杠
  #   - 可热重载，新请求立即使用新地址
  base_url: "https://generativelanguage.googleapis.com"

# ----------------------------------------------------------------------------
# 负载均衡策略
# ----------------------------------------------------------------------------
lb:
  # 在可调度节点之间分配请求的策略
  #
  # round_robin（默认，推荐）：
  #   最少连接优先轮询。优先选择当前活跃请求数最少的节点，
  #   相同负载的节点之间按 ID 字典序轮询。
  #   效果：空闲节点永远优先于忙碌节点，流量均匀分散。
  #
  # fill_first：
  #   填充优先。优先选择 ID 字典序最小的可用节点，
  #   仅当该节点达到并发上限后才向下一个节点分配。
  #   效果：集中使用少数节点，适合节点动态伸缩场景。
  #
  # 可热重载，切换后立即对新请求生效。
  strategy: "round_robin"

# ----------------------------------------------------------------------------
# 节点（WebSocket 代理客户端）配置
# ----------------------------------------------------------------------------
node:
  # 单个节点允许同时处理的最大请求数（多路复用并发上限）
  # 范围：1 ~ 10000
  #
  # 建议值：
  #   - AIStudio 环境建议 3~5，避免触发隐性速率限制
  #   - 可热重载，新请求按新值调度，已分配的请求不受影响
  max_concurrency: 5

  # 网关允许的 WebSocket 节点连接总数上限
  # 设为 0 表示不限制
  #
  # 每个连接约占用 15~25 KB 内存（goroutine 栈 + 读写缓冲）
  # 参考：100 连接 ≈ 2 MB，1000 连接 ≈ 20 MB
  #
  # 注意：同一 node_id 的替换连接不受此限制计数
  # 可热重载，仅影响新连接，已有连接不会被断开
  max_connections: 0

  # 网关主动发送 WebSocket 协议级 Ping 的间隔
  # 用于检测网络层静默断连（如 NAT 超时、中间设备丢弃连接）
  #
  # ⚠️ 不可热重载，修改后需要重启网关才能对已有连接生效
  ws_ping_interval: "30s"

  # 等待节点回复 WebSocket Pong 的超时时间
  # 超时后判定节点失联，关闭连接并将节点标记为 OFFLINE
  # 该节点上的进行中请求将触发重试（如符合重试条件）
  #
  # ⚠️ 不可热重载，修改后需要重启网关才能对已有连接生效
  ws_pong_timeout: "10s"

  # 离线节点记录在内存中的保留时长
  # 超过此时间后，节点记录从管理 API 中消失
  # 节点的统计数据已写入时间窗口桶中，不受此清理影响
  #
  # 自动重连的节点通常在几秒内回来，30 分钟足够覆盖
  # 空渠道在其下属节点全部清理后也会自动清理
  offline_ttl: "30m"

# ----------------------------------------------------------------------------
# 请求处理配置
# ----------------------------------------------------------------------------
request:
  # 客户端请求体的最大允许大小
  # 支持单位：B, KB/KiB, MB/MiB, GB/GiB
  #
  # 此限制同时用于：
  #   1. HTTP 请求体读取上限
  #   2. 非流式上游响应缓冲上限（防止异常大响应耗尽内存）
  #
  # 注意：请求体会通过临时文件缓存以支持重试重放
  # 并发请求的临时文件可能占用 并发数 × max_body_size 的磁盘空间
  max_body_size: "64MB"

  # 所有节点均忙碌时，请求在队列中等待空闲节点的最大时间
  # 超时后返回 503 UNAVAILABLE，而不是无限排队
  #
  # 建议值：
  #   - 面向用户的场景建议 15~30s
  #   - 批处理场景可适当延长
  node_wait_timeout: "30s"

  # 等待队列的最大深度
  # 队列已满时，新请求立即返回 503
  # 范围：0 ~ 100000（设为 0 表示不排队，无空闲节点即拒绝）
  #
  # 队列中的请求仅占用 goroutine 和少量内存（已缓存完请求体）
  queue_max_size: 100

# ----------------------------------------------------------------------------
# 超时配置
# ----------------------------------------------------------------------------
timeout:
  # 流式请求（streamGenerateContent）的首字节响应超时
  # 从 http_request 消息下发至节点后，等待 stream_start 消息的最大时间
  #
  # 大模型的首 Token 生成可能较慢（尤其是长上下文），建议不低于 30s
  stream_first_byte: "60s"

  # 流式请求中两个 stream_chunk 消息之间的最大空闲间隔
  # 超过此时间没有收到新的数据块，判定为上游停滞
  #
  # 对于思考模型（thinking=true），思考阶段可能有较长间隔，
  # 建议适当延长此值
  stream_idle: "30s"

  # 流式和非流式请求的总超时时间（从请求进入代理引擎到响应完成）
  # 这是所有超时的最外层保护，确保请求不会无限挂起
  #
  # 长文本生成可能需要数分钟，建议不低于 300s
  total: "600s"

# ----------------------------------------------------------------------------
# 节点冷却（故障退避）配置
# ----------------------------------------------------------------------------
cooldown:
  # 基础冷却时间
  # 节点返回特定错误状态码（401/403/429/500/502/503/504）时触发冷却
  # 冷却期间该节点不参与请求调度
  base_duration: "30s"

  # 最大冷却时间
  # 连续冷却时间按指数退避增长，但不超过此上限
  # 必须 >= base_duration
  max_duration: "300s"

  # 冷却时间的退避倍数
  # 实际冷却时间 = min(base_duration × multiplier^(连续冷却次数-1), max_duration)
  #
  # 示例（multiplier=2, base=30s, max=300s）：
  #   第 1 次冷却：30s
  #   第 2 次冷却：60s
  #   第 3 次冷却：120s
  #   第 4 次冷却：240s
  #   第 5 次冷却：300s（达到上限）
  #
  # 节点成功完成一次请求后，冷却计数器归零
  # 管理员可通过 POST /admin/nodes/{id}/cooldown 手动控制冷却
  # 手动冷却不会被自动冷却覆盖
  #
  # 必须 >= 1
  multiplier: 2

# ----------------------------------------------------------------------------
# 服务器配置
# ----------------------------------------------------------------------------
server:
  # 优雅关闭时等待进行中请求完成的最大时间
  # 收到 SIGINT/SIGTERM 后：
  #   1. 停止接受新请求（返回 503）
  #   2. 停止接受新 WS 连接
  #   3. 等待进行中请求完成（最多等待此时间）
  #   4. 超时后强制中断剩余请求
  #   5. 关闭所有 WS 连接（发送 1001 Going Away）
  #   6. 关闭日志文件
  #   7. 退出进程
  #
  # 建议值：
  #   - PaaS 平台通常给 30~120s 的 graceful shutdown 窗口
  #   - 应小于容器编排的 terminationGracePeriodSeconds
  drain_timeout: "60s"

# ----------------------------------------------------------------------------
# 日志配置
# ----------------------------------------------------------------------------
log:
  # 日志级别（从低到高）：debug, info, warn, error
  # 仅影响应用日志（app）；访问日志（access）始终以 INFO 级别记录
  #
  # debug：输出详细的调试信息，包括每个 WS 消息的路由
  # info ：标准运行信息，节点连接/断开、配置变更等
  # warn ：警告信息，配置文件缺失、非致命错误等
  # error：错误信息，热重载失败、文件写入失败等
  #
  # 可热重载，立即生效
  level: "info"

  # 标准输出（stdout）的日志格式
  #
  # text：人类可读格式，适合开发调试和 docker logs 直接查看
  #   示例：2024-07-01T12:00:00.123Z INFO  [app] node connected {"node_id":"abc"}
  #
  # json：结构化 JSON 格式，适合日志聚合系统（ELK、Loki 等）
  #   示例：{"timestamp":"...","level":"INFO","source":"app","message":"...","fields":{}}
  #
  # 注意：日志文件始终使用 JSONL 格式（每行一个 JSON 对象），不受此设置影响
  # 可热重载，立即切换
  format: "text"

  # 内存日志环形缓冲区的容量（每个日志源独立）
  # 应用日志和访问日志各维护一个独立缓冲区
  # 供 GET /admin/logs 查询使用，提供毫秒级的内存查询
  #
  # 每条日志约 200~500 字节
  # 参考：1000 条 × 2 源 ≈ 0.4~1 MB
  # 范围：1 ~ 100000
  buffer_size: 1000

  # 日志文件输出配置
  # 文件始终使用 JSONL 格式（每行一个 JSON 对象），确保查询引擎可解析
  # 网关不做日志轮转，请使用外部工具（logrotate、Docker 日志驱动等）
  # 目录不存在时自动创建
  file:
    # 应用日志文件
    # 记录：系统事件、状态变更、错误、管理操作等
    app:
      enabled: true
      path: "./logs/app.log"

    # 访问日志文件
    # 记录：每个 API 请求的完整信息（方法、路径、状态码、耗时、节点等）
    access:
      enabled: true
      path: "./logs/access.log"

  # 日志查询限制（GET /admin/logs）
  query:
    # 单次查询最大扫描行数
    # 防止大文件查询消耗过多 CPU
    # 达到限制后停止扫描，响应中 scan_limit_reached=true
    # 范围：1 ~ 1000000
    max_scan_lines: 50000

    # 单次查询最大扫描字节数
    # 防止大文件查询消耗过多 I/O
    # 支持单位：B, KB, MB, GB
    max_scan_bytes: "50MB"

# ----------------------------------------------------------------------------
# 统计配置
# ----------------------------------------------------------------------------
stats:
  # 已完成请求历史缓冲区大小
  # 保留最近 N 条已完成请求的详细记录，供 GET /admin/requests 查询
  #
  # 每条记录约 200~500 字节
  # 参考：1000 条 ≈ 0.2~0.5 MB
  # 范围：1 ~ 100000
  #
  # 纯内存存储，重启后清零
  # 完整历史请求记录请使用访问日志文件
  request_history_size: 1000

# ----------------------------------------------------------------------------
# API Key 列表
# ----------------------------------------------------------------------------
# 外部客户端调用 Gemini API 时使用的鉴权凭证
# 支持通过以下方式传递（按优先级从高到低）：
#   1. Header: x-goog-api-key
#   2. Header: Authorization: Bearer <key>
#   3. Query:  ?key=<key>
#
# 管理方式：
#   - 通过管理 API 增删改查（推荐）：POST/GET/PATCH/DELETE /admin/keys
#   - 直接编辑本文件后热重载
#   - 管理 API 修改后自动回写本文件
#
# 空列表时拒绝所有 API 请求（返回 401），迫使管理员先创建 Key
#
# 自动生成的 Key 格式：gag-k-<32字符base62随机串>
# 也可在创建时自定义 Key 值（1~256 字符，不含空白）
keys:
  # 下一个自动分配的 ID（由系统维护，请勿手动修改）
  next_id: 1
  # Key 列表
  items: []
  # 示例：
  # items:
  #   - id: 1
  #     value: "gag-k-aB3xY9mN7pQ2rS4tU6vW8xZ0"
  #     note: "LobeChat 前端使用"
  #     enabled: true
  #     created_at: "2024-07-01T00:00:00Z"
  #   - id: 2
  #     value: "my-custom-api-key"
  #     note: "Cursor IDE 使用"
  #     enabled: true
  #     created_at: "2024-07-01T00:00:00Z"

# ----------------------------------------------------------------------------
# WS Token 列表
# ----------------------------------------------------------------------------
# 代理节点（AIStudio Build 环境）通过 WebSocket 接入网关时使用的鉴权凭证
# 通过 ?auth_token=<token> 查询参数传递
#
# 管理方式：
#   - 通过管理 API 增删改查（推荐）：POST/GET/PATCH/DELETE /admin/tokens
#   - 直接编辑本文件后热重载
#   - 管理 API 修改后自动回写本文件
#
# 一个 Token 可被多个节点实例同时使用（各自建立独立 WS 连接）
#
# Token 禁用时：已连接节点不断开但停止调度，新连接被拒绝
# Token 删除时：等待进行中请求完成后断开连接
#
# 自动生成的 Token 格式：gag-t-<24字符base62随机串>
# 也可在创建时自定义 Token 值（1~256 字符，不含空白）
tokens:
  # 下一个自动分配的 ID（由系统维护，请勿手动修改）
  next_id: 1
  # Token 列表
  items: []
  # 示例：
  # items:
  #   - id: 1
  #     value: "gag-t-mN7pQ2rS4tU6vW8x"
  #     note: "AIStudio 节点组 A"
  #     enabled: true
  #     created_at: "2024-07-01T00:00:00Z"

# ============================================================================
# 配置参考
# ============================================================================
#
# 时间格式：Go duration 格式
#   "30s"   = 30 秒
#   "5m"    = 5 分钟
#   "1h"    = 1 小时
#   "1h30m" = 1 小时 30 分钟
#
# 大小格式：数字 + 单位
#   "64MB"  = 64 兆字节
#   "1GB"   = 1 吉字节
#   "512KB" = 512 千字节
#   MB 和 MiB 等价（均为 1024×1024）
#
# 部署建议：
#   10 节点 / 10 并发  → 0.1C / 256M
#   100 节点 / 50 并发 → 0.25C / 512M
#   1000 节点 / 100 并发 → 1C / 1G
#
# ============================================================================
